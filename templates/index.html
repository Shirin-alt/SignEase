{% extends "layout.html" %}
{% block content %}

<div class="conversation-wrapper">
    <!-- Left: Camera Feed (Deaf/Mute side) -->
    <div class="cam-panel">
        <div class="cam-header">
            <i class="fas fa-hand-paper"></i> Sign Detection
            <span id="detectionBadge" class="badge-live">LIVE</span>
        </div>
        <div class="cam-frame">
            <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Camera Feed">
            <div id="detectionOverlay" class="det-overlay"></div>
        </div>
        <div class="cam-controls">
            <select id="detectionModeSelect" class="mode-select">
                <option value="alphabet">Alphabet Mode</option>
                <option value="phrase">Phrase Mode</option>
            </select>
            <button id="sendSignBtn" class="btn-send-sign" title="Send current detected sign">
                <i class="fas fa-paper-plane"></i> Send Sign
            </button>
        </div>
    </div>

    <!-- Right: Messenger-style Chat -->
    <div class="chat-panel">
        <div class="chat-header">
            <div class="chat-title">
                <i class="fas fa-comments"></i> Conversation
            </div>
            <button onclick="clearChat()" class="btn-clear-chat" title="Clear chat">
                <i class="fas fa-trash"></i>
            </button>
        </div>

        <!-- Chat Messages -->
        <div id="chatMessages" class="chat-messages">
            <div class="chat-welcome">
                <i class="fas fa-sign-language"></i>
                <p>Start signing or speaking to begin the conversation!</p>
            </div>
        </div>

        <!-- Speech Input (Non-PWD side) -->
        <div class="chat-input-area">
            <div id="speechStatus" class="speech-status" style="display:none;">
                <span class="recording-dot"></span> Recording...
            </div>
            <div class="input-row">
                <button id="micBtn" class="btn-mic" title="Hold to speak">
                    <i class="fas fa-microphone"></i>
                </button>
                <div class="input-hint" id="inputHint">
                    Press <strong>mic</strong> to speak &nbsp;|&nbsp; Signs auto-detected from camera
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.conversation-wrapper {
    display: flex;
    gap: 1.25rem;
    height: calc(100vh - 90px);
    padding: 0.5rem;
}

/* Camera Panel */
.cam-panel {
    flex: 0 0 42%;
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
}
.cam-header {
    padding: 0.75rem 1rem;
    font-weight: 600;
    color: var(--text-color);
    background: var(--card-bg);
    border-bottom: 1px solid var(--border-color, #e0e0e0);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.badge-live {
    margin-left: auto;
    background: #e53935;
    color: #fff;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 20px;
    animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

.cam-frame {
    flex: 1;
    position: relative;
    background: #000;
    overflow: hidden;
}
.cam-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.det-overlay {
    position: absolute;
    bottom: 10px;
    left: 10px;
    right: 10px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.cam-controls {
    padding: 0.75rem 1rem;
    display: flex;
    gap: 0.75rem;
    align-items: center;
    border-top: 1px solid var(--border-color, #e0e0e0);
}
.mode-select {
    flex: 1;
    padding: 0.4rem 0.6rem;
    border-radius: 8px;
    border: 1px solid var(--border-color, #ccc);
    background: var(--bg-color);
    color: var(--text-color);
    font-size: 0.9rem;
}
.btn-send-sign {
    padding: 0.4rem 1rem;
    background: #0052cc;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: background 0.2s;
}
.btn-send-sign:hover { background: #003d99; }

/* Chat Panel */
.chat-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
}
.chat-header {
    padding: 0.75rem 1rem;
    font-weight: 600;
    color: var(--text-color);
    border-bottom: 1px solid var(--border-color, #e0e0e0);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.chat-title { display: flex; align-items: center; gap: 0.5rem; flex: 1; }
.btn-clear-chat {
    background: none;
    border: none;
    color: #e53935;
    cursor: pointer;
    font-size: 0.9rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.2s;
}
.btn-clear-chat:hover { background: rgba(229,57,53,0.1); }

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    scroll-behavior: smooth;
}
.chat-welcome {
    text-align: center;
    color: var(--text-gray, #888);
    margin: auto;
    padding: 2rem;
}
.chat-welcome i { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }

/* Message Bubbles */
.msg-bubble {
    max-width: 75%;
    padding: 0.6rem 1rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
    position: relative;
    animation: fadeInUp 0.25s ease;
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Sign messages — left side (deaf/mute) */
.msg-sign {
    align-self: flex-start;
    background: #e8f0fe;
    color: #1a237e;
    border-bottom-left-radius: 4px;
}
.dark-mode .msg-sign { background: #1a2a4a; color: #90caf9; }

/* Speech messages — right side (non-PWD) */
.msg-speech {
    align-self: flex-end;
    background: #0052cc;
    color: #fff;
    border-bottom-right-radius: 4px;
}

.msg-meta {
    font-size: 0.72rem;
    opacity: 0.65;
    margin-top: 3px;
    display: block;
}
.msg-sign .msg-meta { text-align: left; }
.msg-speech .msg-meta { text-align: right; }

.msg-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
    display: block;
    opacity: 0.7;
}

/* Chat Input */
.chat-input-area {
    padding: 0.75rem 1rem;
    border-top: 1px solid var(--border-color, #e0e0e0);
    background: var(--card-bg);
}
.speech-status {
    font-size: 0.85rem;
    color: #e53935;
    margin-bottom: 0.4rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
}
.recording-dot {
    width: 8px; height: 8px;
    background: #e53935;
    border-radius: 50%;
    animation: pulse 0.8s infinite;
    display: inline-block;
}
.input-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}
.btn-mic {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: #0052cc;
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.1s;
    flex-shrink: 0;
}
.btn-mic:hover { background: #003d99; }
.btn-mic.recording { background: #e53935; transform: scale(1.1); }
.input-hint {
    color: var(--text-gray, #888);
    font-size: 0.85rem;
}

@media (max-width: 768px) {
    .conversation-wrapper { flex-direction: column; height: auto; }
    .cam-panel { flex: none; height: 300px; }
}
</style>

<script>
(function() {
    // ── State ──────────────────────────────────────────────────────────
    let lastSignTimestamp = null;
    let signPollInterval = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentDetectedSign = null;

    // ── DOM refs ───────────────────────────────────────────────────────
    const chatMessages   = document.getElementById('chatMessages');
    const detOverlay     = document.getElementById('detectionOverlay');
    const micBtn         = document.getElementById('micBtn');
    const speechStatus   = document.getElementById('speechStatus');
    const modeSelect     = document.getElementById('detectionModeSelect');
    const sendSignBtn    = document.getElementById('sendSignBtn');

    // ── Helpers ────────────────────────────────────────────────────────
    function now() {
        return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeWelcome() {
        const w = chatMessages.querySelector('.chat-welcome');
        if (w) w.remove();
    }

    // ── Add message bubble ─────────────────────────────────────────────
    function addMessage(text, type, subtext) {
        removeWelcome();
        const div = document.createElement('div');
        div.className = `msg-bubble msg-${type}`;
        const label = type === 'sign' ? '🤟 Sign' : '🎤 Speech';
        div.innerHTML = `
            <span class="msg-label">${label}</span>
            ${text}
            ${subtext ? `<br><small style="opacity:0.7">${subtext}</small>` : ''}
            <span class="msg-meta">${now()}</span>
        `;
        chatMessages.appendChild(div);
        scrollToBottom();
    }

    // ── Sign Detection Polling ─────────────────────────────────────────
    function startSignPolling() {
        if (signPollInterval) return;
        signPollInterval = setInterval(async () => {
            try {
                const res  = await fetch('/latest');
                const data = await res.json();

                if (data.sign && data.conf >= 0.75) {
                    const display = data.display || data.sign.toUpperCase();
                    const conf    = Math.round(data.conf * 100);
                    detOverlay.textContent = `${display}  ${conf}%`;
                    currentDetectedSign = { sign: data.sign, display, conf, filipino: data.filipino, timestamp: data.timestamp };

                    // Auto-add to chat if it's a new detection
                    if (data.timestamp && data.timestamp !== lastSignTimestamp) {
                        lastSignTimestamp = data.timestamp;
                        const sub = data.filipino ? `(${data.filipino})` : '';
                        addMessage(display, 'sign', sub);
                        saveDetection(data.sign, data.conf);
                        if (window.Gamification) window.Gamification.addXP(10);
                    }
                } else {
                    detOverlay.textContent = '';
                    currentDetectedSign = null;
                }
            } catch(e) { /* silent */ }
        }, 350);
    }

    // ── Manual Send Sign button ────────────────────────────────────────
    sendSignBtn.addEventListener('click', () => {
        if (currentDetectedSign) {
            const sub = currentDetectedSign.filipino ? `(${currentDetectedSign.filipino})` : '';
            addMessage(currentDetectedSign.display, 'sign', sub);
            saveDetection(currentDetectedSign.sign, currentDetectedSign.conf / 100);
        }
    });

    // ── Detection mode select ──────────────────────────────────────────
    modeSelect.addEventListener('change', async () => {
        await fetch('/set_mode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode: modeSelect.value })
        });
        lastSignTimestamp = null;
    });

    // ── Mic button (Speech) ────────────────────────────────────────────
    micBtn.addEventListener('click', () => {
        if (isRecording) stopSpeech();
        else startSpeech();
    });

    async function startSpeech() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            let mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4',''].find(m => !m || MediaRecorder.isTypeSupported(m));
            mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
            audioChunks = [];

            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                speechStatus.style.display = 'none';
                stream.getTracks().forEach(t => t.stop());

                const blob = new Blob(audioChunks, { type: mime || 'audio/webm' });
                if (blob.size > 0) await sendSpeech(blob, mime);
            };

            mediaRecorder.start();
            isRecording = true;
            micBtn.classList.add('recording');
            micBtn.innerHTML = '<i class="fas fa-stop"></i>';
            speechStatus.style.display = 'flex';
        } catch(e) {
            alert('Microphone access denied: ' + e.message);
        }
    }

    function stopSpeech() {
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    }

    async function sendSpeech(blob, mime) {
        const tempDiv = document.createElement('div');
        tempDiv.className = 'msg-bubble msg-speech';
        tempDiv.innerHTML = '<span class="msg-label">🎤 Speech</span><i class="fas fa-spinner fa-spin"></i> Processing...';
        removeWelcome();
        chatMessages.appendChild(tempDiv);
        scrollToBottom();

        const form = new FormData();
        const ext  = (mime || '').includes('mp4') ? 'mp4' : 'webm';
        form.append('audio', blob, `rec.${ext}`);

        try {
            const res  = await fetch('/speech_recognize', { method: 'POST', body: form });
            const data = await res.json();
            if (res.ok && data.text) {
                tempDiv.innerHTML = `<span class="msg-label">🎤 Speech</span>${data.text}<span class="msg-meta">${now()}</span>`;
                saveTranscription(data.text);
                if (window.Gamification) window.Gamification.addXP(5);
            } else {
                tempDiv.remove();
            }
        } catch(e) {
            tempDiv.remove();
        }
        scrollToBottom();
    }

    // ── Save helpers ───────────────────────────────────────────────────
    async function saveDetection(sign, conf) {
        await fetch('/save_detection', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sign, confidence: conf })
        }).catch(() => {});
    }

    async function saveTranscription(text) {
        await fetch('/save_transcription', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        }).catch(() => {});
    }

    // ── Clear chat ─────────────────────────────────────────────────────
    window.clearChat = function() {
        chatMessages.innerHTML = `
            <div class="chat-welcome">
                <i class="fas fa-sign-language"></i>
                <p>Start signing or speaking to begin the conversation!</p>
            </div>`;
        lastSignTimestamp = null;
    };

    // ── Boot ───────────────────────────────────────────────────────────
    startSignPolling();
})();
</script>

{% endblock content %}
